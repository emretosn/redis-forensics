#cloud-config
# =============================================================================
# redis-vm first-boot configuration.
# Installs Redis from the official APT repo and configures it as a forensic
# evidence source (Section VI). Evidence is consolidated under a single root
# (/var/forensics) that a restricted, read-only `evidence` user exposes over SSH.
# forensics-vm PULLS from here; this host holds NO credentials to the collector.
# Placeholders (ending in _B64, plus the pull public key) are filled by main.bicep.
# =============================================================================
package_update: true
package_upgrade: false

# Restricted user for the collector's read-only evidence pull. It has no password
# and its SSH key is locked to an rrsync forced command (set up in runcmd).
users:
  - default
  - name: evidence
    gecos: Redis forensic evidence reader (read-only pull)
    shell: /bin/bash
    lock_passwd: true

write_files:
  # --- forensic runtime config (host, admin creds, evidence root) ------------
  - path: /etc/redis-forensics/forensics.env
    permissions: '0600'
    owner: root:root
    encoding: b64
    content: __ENV_B64__

  # --- Redis server config + ACL users (passwords/bind IP pre-substituted) ---
  - path: /etc/redis/redis.conf
    permissions: '0640'
    owner: root:root
    encoding: b64
    content: __REDIS_CONF_B64__

  - path: /etc/redis/users.acl
    permissions: '0640'
    owner: root:root
    encoding: b64
    content: __USERS_ACL_B64__

  # --- authorized_keys line for the read-only evidence pull user -------------
  # Forced command restricts the key to `rrsync -ro /var/forensics`: read-only,
  # rooted at the evidence tree, no shell, no forwarding.
  - path: /etc/redis-forensics/evidence.authorized_keys
    permissions: '0644'
    owner: root:root
    content: |
      command="/usr/local/bin/rrsync -ro /var/forensics",no-agent-forwarding,no-port-forwarding,no-pty,no-user-rc,no-X11-forwarding __PULL_PUBKEY__

  # --- forensic collection scripts (local only) ------------------------------
  - path: /usr/local/bin/forensic-monitor.sh
    permissions: '0755'
    encoding: b64
    content: __MONITOR_B64__
  - path: /usr/local/bin/forensic-config-snap.sh
    permissions: '0755'
    encoding: b64
    content: __CONFIGSNAP_B64__
  - path: /usr/local/bin/forensic-export-local.sh
    permissions: '0755'
    encoding: b64
    content: __EXPORT_B64__
  - path: /usr/local/bin/seed-data.sh
    permissions: '0755'
    encoding: b64
    content: __SEED_B64__

  # --- systemd units (static) ------------------------------------------------
  - path: /etc/systemd/system/redis-forensic-monitor.service
    content: |
      [Unit]
      Description=Redis continuous MONITOR capture (seal-and-rotate)
      After=redis-server.service
      Requires=redis-server.service
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/forensic-monitor.sh
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

  # Rolls a fresh sealed MONITOR segment by restarting the capture service.
  - path: /etc/systemd/system/redis-forensic-monitor-rotate.service
    content: |
      [Unit]
      Description=Roll a new sealed Redis MONITOR segment
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/systemctl restart redis-forensic-monitor.service

  - path: /etc/systemd/system/redis-forensic-monitor-rotate.timer
    content: |
      [Unit]
      Description=Rotate Redis MONITOR capture
      [Timer]
      # Production cadence:
      # OnBootSec=5min
      # OnUnitActiveSec=1h
      # Test deployment:
      OnBootSec=45sec
      OnUnitActiveSec=30sec
      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/redis-forensic-config-snap.service
    content: |
      [Unit]
      Description=Redis CONFIG GET snapshot
      After=redis-server.service
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/forensic-config-snap.sh

  - path: /etc/systemd/system/redis-forensic-config-snap.timer
    content: |
      [Unit]
      Description=Run Redis CONFIG snapshot
      [Timer]
      # Production cadence:
      # OnBootSec=2min
      # OnUnitActiveSec=5min
      # Test deployment:
      OnBootSec=15sec
      OnUnitActiveSec=3sec
      [Install]
      WantedBy=timers.target

  # Local-only export: ACL LOG + BGSAVE + mirror rdb/aof/log into the evidence root.
  - path: /etc/systemd/system/redis-forensic-export.service
    content: |
      [Unit]
      Description=Export Redis forensic artifacts into the evidence root
      After=redis-server.service
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/forensic-export-local.sh

  - path: /etc/systemd/system/redis-forensic-export.timer
    content: |
      [Unit]
      Description=Refresh Redis forensic evidence root (test cadence)
      [Timer]
      # Production cadence:
      # OnBootSec=3min
      # OnUnitActiveSec=5min
      # Test deployment:
      OnBootSec=20sec
      OnUnitActiveSec=3sec
      [Install]
      WantedBy=timers.target

runcmd:
  # 1. Install Redis from the official Redis APT repository.
  - install -m 0755 -d /usr/share/keyrings
  - curl -fsSL https://packages.redis.io/gpg -o /tmp/redis.gpg
  - gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg /tmp/redis.gpg
  - chmod 644 /usr/share/keyrings/redis-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" > /etc/apt/sources.list.d/redis.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y redis rsync

  # 2. Provide rrsync (restricted rsync wrapper) at a stable path. Ubuntu 22.04's
  #    rsync ships it gzipped under /usr/share/doc; newer releases ship /usr/bin/rrsync.
  - |
    if [ ! -x /usr/local/bin/rrsync ]; then
      if [ -f /usr/share/doc/rsync/scripts/rrsync.gz ]; then
        gzip -dc /usr/share/doc/rsync/scripts/rrsync.gz > /usr/local/bin/rrsync
      elif [ -f /usr/share/doc/rsync/scripts/rrsync ]; then
        cp /usr/share/doc/rsync/scripts/rrsync /usr/local/bin/rrsync
      elif [ -x /usr/bin/rrsync ]; then
        cp /usr/bin/rrsync /usr/local/bin/rrsync
      fi
      chmod 0755 /usr/local/bin/rrsync || true
    fi

  # 3. Install the evidence user's locked-down authorized_keys.
  - mkdir -p /home/evidence/.ssh
  - cp /etc/redis-forensics/evidence.authorized_keys /home/evidence/.ssh/authorized_keys
  - chown -R evidence:evidence /home/evidence/.ssh
  - chmod 700 /home/evidence/.ssh
  - chmod 600 /home/evidence/.ssh/authorized_keys

  # 4. Fix ownership/permissions for Redis-managed files and the evidence root.
  #    /var/forensics is setgid to the `evidence` group so new artifacts are group
  #    readable (read-only) by the pull user, and nobody else.
  - mkdir -p /var/log/redis /var/lib/redis /var/forensics
  - chown -R redis:redis /etc/redis/redis.conf /etc/redis/users.acl /var/log/redis /var/lib/redis
  - chown root:evidence /var/forensics
  - chmod 2750 /var/forensics

  # 5. Start Redis with our config, then seed simple key:value data.
  - systemctl enable redis-server
  - systemctl restart redis-server
  - sleep 3
  - /usr/local/bin/seed-data.sh || true

  # 6. Enable forensic collection: MONITOR (+ rotation), CONFIG snapshot, local export.
  - systemctl daemon-reload
  - systemctl enable --now redis-forensic-monitor.service
  - systemctl enable --now redis-forensic-monitor-rotate.timer
  - systemctl enable --now redis-forensic-config-snap.timer
  - systemctl enable --now redis-forensic-export.timer
